[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gformlib-cli"
version = "0.1.1"
description = "Command-line interface for gformlib – manage Google Forms from the terminal."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andhitia Rama", email = "andhitia.r@gmail.com" }]
keywords = ["google", "forms", "api", "cli", "survey", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "gformlib>=0.2.0",
    "typer[all]>=0.12.0",
]

[project.scripts]
gformcli = "gformlib_cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    "flake8>=6.1",
    "tox>=4.11",
]
docs = [
    "sphinx>=7.1",
    "sphinx-rtd-theme>=1.3",
    "sphinxcontrib-httpdomain>=1.8",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/andhit-r/gformlib-cli"
Documentation = "https://gformlib-cli.readthedocs.io"
Repository = "https://github.com/andhit-r/gformlib-cli"
"Bug Tracker" = "https://github.com/andhit-r/gformlib-cli/issues"
Changelog = "https://github.com/andhit-r/gformlib-cli/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gformlib_cli = ["py.typed"]

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 99
target-version = ["py39", "py310", "py311", "py312"]

# ── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 99
src_paths = ["src", "tests"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/gformlib_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
