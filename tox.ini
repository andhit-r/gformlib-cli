[tox]
envlist = py39, py310, py311, py312, lint, type
isolated_build = true

[testenv]
extras = dev
commands =
    pytest --cov=gformlib_cli --cov-report=term-missing {posargs}

[testenv:lint]
extras = dev
commands =
    black --check src tests
    isort --check-only src tests
    flake8 src tests

[testenv:type]
extras = dev
commands =
    mypy src/gformlib_cli

[flake8]
max-line-length = 99
extend-ignore = E203, W503
